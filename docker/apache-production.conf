ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Bound process count for the single-owner console.
StartServers 1
MinSpareServers 1
MaxSpareServers 2
MaxRequestWorkers 4
MaxConnectionsPerChild 1000

<VirtualHost *:${PORT}>
    DocumentRoot /app/public
    # Railway terminates public TLS at its edge. The production image is served
    # only through that HTTPS edge, so protocol mapping is a server setting;
    # arbitrary client Forwarded/X-Forwarded-Host headers remain untrusted.
    SetEnv HTTPS on
    CustomLog /dev/null common
    ErrorLog /proc/self/fd/2
    LogLevel crit
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/(style\.css|index\.php)$
    RewriteRule ^ /index.php [END]

    <Directory /app/public>
        AllowOverride None
        Options -Indexes -MultiViews
        Require all granted
        DirectoryIndex index.php
        # All routes have already been mapped to the front controller.
        <FilesMatch "^(?!index\.php$|style\.css$)">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
