parameters:
  app.default_state_dir: '%kernel.project_dir%/var/state'
  app.state_dir: '%env(default:app.default_state_dir:APP_STATE_DIR)%'
  env(APP_SECRET): ''
  env(ADMIN_USERNAME): ''
  env(ADMIN_PASSWORD_HASH): ''
  env(APP_ORIGIN): ''
  env(QUERYLENS_BASE_URL): ''
  env(MANAGER_DATABASE_URL): ''

services:
  _defaults:
    autowire: true
    autoconfigure: true
  App\:
    resource: ../src/
    exclude: ../src/Kernel.php
  App\Security\OwnerConfiguration:
    arguments:
      $username: '%env(ADMIN_USERNAME)%'
      $passwordHash: '%env(ADMIN_PASSWORD_HASH)%'
      $appSecret: '%env(APP_SECRET)%'
      $origin: '%env(APP_ORIGIN)%'
  logger:
    alias: App\Logging\SanitizedLogger
  Psr\Log\LoggerInterface:
    alias: App\Logging\SanitizedLogger
  cache.login_limiter:
    class: Symfony\Component\Cache\Adapter\FilesystemAdapter
    arguments:
      $namespace: 'qlm_owner_login_%kernel.environment%'
      $directory: '%app.state_dir%/login-limiter'
