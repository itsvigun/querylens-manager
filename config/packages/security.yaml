security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
  providers:
    owner:
      id: App\Security\OwnerProvider
  session_fixation_strategy: migrate
  firewalls:
    main:
      lazy: true
      provider: owner
      form_login:
        login_path: login
        check_path: login
        enable_csrf: true
        default_target_path: console
        always_use_default_target_path: true
      login_throttling:
        limiter: App\Security\OwnerLoginLimiter
      logout:
        path: logout
        target: login
        enable_csrf: true
        invalidate_session: true
  access_control:
    - { path: ^/health/live$, roles: PUBLIC_ACCESS }
    - { path: ^/login$, roles: PUBLIC_ACCESS }
    - { path: ^/, roles: ROLE_ADMIN }
